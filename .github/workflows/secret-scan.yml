name: Secret scan

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 必须：全历史扫描，只看最新 commit 会漏掉历史泄露
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

  patterns:
    name: repo-specific patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Custom pattern scan
        run: bash scripts/check-leaks.sh .

  commit-ident:
    name: commit author identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject PII in commit authors
        run: |
          set -e
          bad=$(git log --all --format='%ae|%ce' | tr '|' '\n' | sort -u \
                | grep -E '[0-9]{11,}|LI[0-9]{11}' || true)
          if [ -n "$bad" ]; then
            echo "::error::提交者身份里出现了疑似手机号："
            echo "$bad"
            exit 1
          fi
          echo "commit author identity: clean"
