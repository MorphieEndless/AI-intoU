name: Test server

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deployment script regression tests (no Docker required)
        working-directory: .
        run: |
          bash -n deploy/setup-server.sh
          python -m unittest discover -s deploy/tests -v
      - name: Install dependencies
        run: python -m pip install -r requirements-server.txt httpx pytest buttplug
      - name: Compile Python sources
        run: python -m compileall -q app server scripts tests
      - name: Import smoke + behavior contract + data layer tests (pytest)
        # Runs FIRST among server tests: if the app can't be imported,
        # nothing below means anything. The K1 lesson.
        run: PYTHONPATH=. python -m pytest tests/ -v
      - name: Server verification
        run: python tests/verify_server.py
      - name: Governor verification
        run: python tests/verify_governor.py
      - name: Numeric inputs verification
        run: python tests/verify_numeric_inputs.py
      - name: Patterns verification
        run: python tests/verify_patterns.py
        env:
          PYTHONPATH: .
      - name: App pattern library API verification
        run: PYTHONPATH=. python tests/verify_pattern_routes.py
      - name: Relay verification
        run: python tests/verify_relays.py
        env:
          PYTHONPATH: .

  docker-image:
    # The pytest job runs from the source tree, where every package is on the
    # path. That cannot catch a Dockerfile that forgets to COPY a package the
    # code imports. This job builds the real image and boots it the way the
    # deploy script does, then waits for the health endpoint.
    # Credentials are generated per run and passed by variable reference, so
    # no credential-shaped literal ever lands in the repository.
    name: Docker image boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate throwaway credentials
        run: |
          echo "CI_KEY=$(python3 -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"
      - name: Build image
        run: docker build -t aiu-server:ci server
      - name: Import smoke inside the image
        run: |
          docker run --rm -e "SB_SECRET_KEY=$CI_KEY" aiu-server:ci \
            python -c "import server.app, app.domain.patterns; print('import ok')"
      - name: Boot and wait for health
        run: |
          docker run -d --name aiu -p 127.0.0.1:8420:8420 \
            -e "SB_SECRET_KEY=$CI_KEY" \
            -e SB_REGISTRATION_OPEN=false \
            -e SB_PATTERNS_DIR=/data/patterns \
            aiu-server:ci
          for i in $(seq 1 30); do
            if curl --max-time 3 -fsS http://localhost:8420/health; then
              echo; echo "container healthy"
              code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8420/mcp \
                -H "content-type: application/json" -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
              [ "$code" = "401" ] || { echo "::error::unauthenticated MCP returned $code, expected 401"; exit 1; }
              docker exec aiu python -m app.cli doctor | tail -n 20
              exit 0
            fi
            sleep 2
          done
          echo "::error::container did not become healthy"
          docker logs aiu | tail -n 60
          exit 1
      - name: Container logs
        if: always()
        run: docker logs aiu 2>&1 | tail -n 40 || true
