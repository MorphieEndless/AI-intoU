name: Test server

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deployment script regression tests (no Docker required)
        working-directory: .
        run: |
          bash -n deploy/setup-server.sh
          python -m unittest discover -s deploy/tests -v
      - name: Install dependencies
        run: python -m pip install -r requirements-server.txt httpx
      - name: Compile Python sources
        run: python -m compileall -q server tests
      - name: Server verification
        run: python tests/verify_server.py
      - name: Static Bearer verification
        run: python tests/verify_static_token.py
      - name: Governor verification
        run: python tests/verify_governor.py
      - name: Numeric inputs verification
        run: python tests/verify_numeric_inputs.py
      - name: Patterns verification
        run: python tests/verify_patterns.py
      - name: Relay verification
        run: python tests/verify_relays.py
