name: Release

# 正式发版：推送 v* tag（例如 v0.17.0）时触发。
# 只构建签名的 release APK，发布为正式 Release（非 prerelease），不附带 debug 包。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.17.0
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch gradle wrapper jar
        working-directory: android
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL --retry 3 -o gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches versionName
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match versionName $version"
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::KEYSTORE_B64 is not configured; a formal release must be signed."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/yingti-release.jks"

      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/yingti-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          src="android/app/build/outputs/apk/release/app-release.apk"
          apk="$RUNNER_TEMP/AI-intoU-${TAG}.apk"
          cp "$src" "$apk"
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          notes="$RUNNER_TEMP/notes.md"
          if [ -f "docs/release-notes/${TAG}.md" ]; then cp "docs/release-notes/${TAG}.md" "$notes"; else echo "AI-intoU ${TAG}" > "$notes"; fi
          printf '\n\n---\nSHA-256: `%s`\n' "$sha" >> "$notes"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease=false --latest --notes-file "$notes"
          else
            gh release create "$TAG" --verify-tag --latest --title "AI-intoU ${TAG}" --notes-file "$notes"
          fi
          gh release upload "$TAG" "$apk" --clobber
