name: Cleanup artifacts

# Authorized one-time branch cleanup; scheduled runs apply only after merge.
on:
  push:
    branches: [refactor/relay-performance]
    paths: [.github/workflows/cleanup-artifacts.yml]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  actions: write
  contents: read
  pull-requests: write

jobs:
  prune:
    name: Keep latest APKs and test report
    runs-on: ubuntu-latest
    steps:
      - name: Delete older build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          gh api --paginate --slurp "repos/$GH_REPO/actions/artifacts?per_page=100" > "$RUNNER_TEMP/artifact-pages.json"
          python3 - <<'PYCODE'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          pages = json.loads((root / "artifact-pages.json").read_text())
          artifacts = [a for page in pages for a in page.get("artifacts", [])]
          allowed = {"yingti-bridge-debug-apk", "yingti-bridge-release-apk", "android-unit-test-reports"}
          artifacts.sort(key=lambda a: (a["created_at"], a["id"]), reverse=True)
          keep = {}
          for artifact in artifacts:
              if artifact["name"] in allowed and not artifact["expired"]:
                  keep.setdefault(artifact["name"], artifact)
          keep_ids = {a["id"] for a in keep.values()}
          drop = [a for a in artifacts if a["name"] in allowed and a["id"] not in keep_ids]
          deleted, failed, freed = 0, [], 0
          for artifact in drop:
              result = subprocess.run(
                  ["gh", "api", "-X", "DELETE",
                   "repos/%s/actions/artifacts/%s" % (os.environ["GH_REPO"], artifact["id"])],
                  capture_output=True, text=True)
              if result.returncode == 0:
                  deleted += 1
                  freed += artifact["size_in_bytes"]
              else:
                  failed.append(artifact["id"])
          summary = "### Artifact cleanup result\n\n"
          summary += "Deleted %d old build artifacts (%.1f MiB). Failed deletions: %d.\n\n" % (deleted, freed / 1024**2, len(failed))
          summary += "Preserved newest non-expired artifact for each build type:\n"
          for name, artifact in sorted(keep.items()):
              summary += "- `%s`, ID `%s`, created `%s`\n" % (name, artifact["id"], artifact["created_at"])
          if not keep:
              summary += "- No non-expired APK/test report was available.\n"
          summary += "\nUnrecognized artifact names, workflow logs, source history and other repositories were not modified.\n"
          summary += "GitHub may take 6–12 hours to update storage usage.\n"
          if failed:
              summary += "\nFailed artifact IDs: " + ", ".join(map(str, failed)) + "\n"
          (root / "cleanup-summary.md").write_text(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write(summary)
          print(summary)
          if failed:
              raise SystemExit(1)
          PYCODE

      - name: Post cleanup result on pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          [ -f "$RUNNER_TEMP/cleanup-summary.md" ] || exit 0
          pr=$(gh pr list --head "$HEAD_BRANCH" --json number --jq '.[0].number // empty')
          [ -n "$pr" ] || exit 0
          gh pr comment "$pr" --body-file "$RUNNER_TEMP/cleanup-summary.md"
