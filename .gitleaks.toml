# AI-intoU 泄露扫描规则（gitleaks v8）
#
# 与 scripts/check-leaks.sh 互为补充：
#   · gitleaks 负责【通用密钥】（内置规则） + 本仓库特有的基础设施信息形态
#   · check-leaks.sh 负责快速兜底，并把「已知遗留示例地址」以提醒（而非失败）方式呈现
#
# 注意：gitleaks 用 Go RE2，不支持前后向断言（(?=)、(?!)、(?<=)）。规则里不得使用。
title = "AI-intoU leak scan"

[extend]
useDefault = true

# ── 1. 公网 IPv4 字面量（云主机源站地址的典型形态）──────────────────────
[[rules]]
id = "aiu-public-ipv4"
description = "Public IPv4 literal — 可能是源站服务器地址"
regex = '''\b(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\b'''

  [[rules.allowlists]]
  description = "回环 / RFC1918 / 链路本地 / RFC5737 文档地址 / 公共 DNS"
  regexes = [
    '''\b(?:0|10|127|192\.168|169\.254|255)\.''',
    '''\b172\.(?:1[6-9]|2[0-9]|3[01])\.''',
    '''\b(?:192\.0\.2|198\.51\.100|203\.0\.113)\.''',
    '''\b(?:1\.1\.1\.1|8\.8\.8\.8|9\.9\.9\.9)\b''',
  ]

  # 已存在的遗留示例地址：不阻塞 CI，但属于待偿技术债。
  # 192.0.2.14 来自上游 README（AletheiaVox），192.0.2.14 是本项目早期占位符。
  # 两者都应在后续文档 PR 中换成 RFC 5737（192.0.2.0/24）。
  [[rules.allowlists]]
  description = "已知遗留示例地址（待替换）"
  regexes = ['''\b139\.59\.156\.242\b''', '''\b11\.4\.5\.14\b''']

# ── 2. 内部部署路径 / 项目专属服务名 ────────────────────────────────────
[[rules]]
id = "aiu-internal-deploy-path"
description = "内部部署绝对路径（/opt、/srv、/etc/nginx…）"
regex = '''(?:/opt|/srv|/etc/nginx|/etc/systemd|/etc/ssl|/etc/fail2ban)/[A-Za-z0-9._/-]{3,}'''

[[rules]]
id = "aiu-project-service-op"
description = "项目专属 systemd 服务单元操作（泄露部署形态与本机服务名）"
regex = '''(?i)systemctl\s+(?:restart|start|stop|kill|status|enable)\s+(?:signal-bridge|yingti|ai-intou|aiu)[A-Za-z0-9@._-]*'''

# ── 3. 示例文件里被填了真实值 ──────────────────────────────────────────
[[rules]]
id = "aiu-filled-secret-in-example"
description = ".env / 示例文件里被填了真实密钥"
regex = '''(?:SB_SECRET_KEY|SB_STATIC_BEARER_TOKEN)\s*=\s*[A-Za-z0-9_+/=-]{16,}'''

  [[rules.allowlists]]
  regexes = [
    '''paste-your-generated-key-here''',
    '''your-secret-key-here''',
    '''至少32字符的随机字符串''',
  ]

# ── 4. 内部域名与隧道地址 ──────────────────────────────────────────────
[[rules]]
id = "aiu-internal-hostname"
description = "内部域名 / 隧道 / 动态 DNS 地址残留"
regex = '''(?i)(?:in2\.[a-z0-9-]+\.(?:top|com|net)|(?:[a-z0-9-]+\.)?example\.[a-z]+|[a-z0-9-]{2,}\.ngrok-free\.app|trycloudflare\.com|[a-z0-9-]{2,}\.duckdns\.org)'''

  [[rules.allowlists]]
  description = "占位符与上游示例"
  regexes = [
    '''your-subdomain\.duckdns\.org''',
    '''www\.duckdns\.org''',
    '''signal-bridge\.duckdns\.org'''
  ]

# ── 5. 提交者身份里的 PII ──────────────────────────────────────────────
[[rules]]
id = "aiu-pii-in-commit-ident"
description = "提交者邮箱里出现手机号（如手机号作为邮箱前缀）"
regex = '''(?i)\b(?:1[3-9][0-9]{9}|LI[0-9]{11})@'''
